<!DOCTYPE html>
<html>
<head>
    <title>Opportunities - Creator Hub</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================================
           CATEGORY PAGE
        ================================= */

        #categoryPage {
            display: block;
        }

        /* ================================
           RESULT PAGE
        ================================= */

        #resultPage {
            display: none;
            width: 100%;
        }

        .result-header {
            margin-bottom: 25px;
        }

        .result-header h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .result-header p {
            color: white;
            font-weight: bold;
        }

        /* Opportunity cards */

        #opportunityList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .opportunity-card {
            background: white;
            color: #333;
            padding: 22px;
            border-radius: 15px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.15);

            text-align: left;
        }

        .opportunity-card h2 {
            color: #7b2cbf;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .opportunity-card p {
            color: #444;
            margin: 8px 0;
            line-height: 1.5;
        }

        /* Apply button */

        .apply-btn {
            display: inline-block;

            margin-top: 15px;
            padding: 10px 18px;

            background: #7b2cbf;
            color: white;

            text-decoration: none;

            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;
        }

        .apply-btn:hover {
            background: #5a189a;
        }

        /* Back button */

        .back-btn {
            margin-top: 25px;

            background: white;
            color: #333;
        }

        .back-btn:hover {
            background: #eeeeee;
        }

        /* No result */

        .no-result {
            background: white;
            color: #333;

            padding: 20px;

            border-radius: 12px;

            font-weight: bold;

            text-align: center;
        }

        /* Success message */

        .success-message {
            background: #f3e8ff;
            color: #6a1b9a;

            padding: 10px;

            margin-top: 15px;

            border-radius: 8px;

            font-weight: bold;

            text-align: center;
        }

        /* Mobile */

        @media (max-width: 700px) {

            #opportunityList {
                grid-template-columns: 1fr;
            }

            .opportunity-card {
                padding: 18px;
            }

        }

    </style>
</head>


<body>


<div class="container">


    <!-- =================================
         CATEGORY PAGE
    ================================== -->

    <div id="categoryPage">

        <h1>🎯 Opportunities</h1>

        <p style="color:white; font-weight:bold;">
            Choose an opportunity category
        </p>

        <br>


        <button onclick="showOpportunities('Hackathon')">
            🏆 Hackathons
        </button>

        <br><br>


        <button onclick="showOpportunities('Internship')">
            💼 Internships
        </button>

        <br><br>


        <button onclick="showOpportunities('Scholarship')">
            🎓 Scholarships
        </button>

        <br><br>


        <button onclick="showOpportunities('Workshop')">
            📚 Workshops
        </button>

        <br><br>


        <button onclick="showOpportunities('Startup Program')">
            🚀 Startup Programs
        </button>

        <br><br>


        <button onclick="location.href='dashboard.html'">
            ⬅ Back to Dashboard
        </button>

    </div>



    <!-- =================================
         RESULT PAGE
    ================================== -->

    <div id="resultPage">


        <div class="result-header">

            <h1 id="categoryTitle">
                🎯 Opportunities
            </h1>

            <p>
                Explore the available opportunities
            </p>

        </div>


        <!-- Results -->

        <div id="opportunityList"></div>


        <br>


        <button
            class="back-btn"
            onclick="backToCategories()">

            ⬅ Back to Categories

        </button>


        <br>


        <button
            class="back-btn"
            onclick="location.href='dashboard.html'">

            🏠 Back to Dashboard

        </button>


    </div>


</div>



<script>


/* =================================
   SHOW OPPORTUNITIES
================================= */

function showOpportunities(category) {


    /* Hide category page */

    document.getElementById("categoryPage").style.display = "none";


    /* Show result page */

    document.getElementById("resultPage").style.display = "block";


    /* Category title */

    let title = "";


    if (category === "Hackathon") {

        title = "🏆 Hackathons";

    }

    else if (category === "Internship") {

        title = "💼 Internships";

    }

    else if (category === "Scholarship") {

        title = "🎓 Scholarships";

    }

    else if (category === "Workshop") {

        title = "📚 Workshops";

    }

    else if (category === "Startup Program") {

        title = "🚀 Startup Programs";

    }


    document.getElementById("categoryTitle").innerText = title;


    /* Loading message */

    document.getElementById("opportunityList").innerHTML = `
        <div class="no-result">
            Loading opportunities...
        </div>
    `;


    /* Fetch backend data */

    fetch("http://localhost:8081/api/opportunities")


        .then(response => response.json())


        .then(data => {


            let result = "";


            data.forEach(opportunity => {


                if (
                    opportunity.category.trim().toLowerCase() ===
                    category.trim().toLowerCase()
                ) {


                    result += `

                        <div class="opportunity-card">

                            <h2>
                                ${getIcon(category)}
                                ${opportunity.name}
                            </h2>


                            <p>

                                <strong>
                                    🏢 Organization:
                                </strong>

                                ${opportunity.organization}

                            </p>


                            <p>

                                <strong>
                                    📝 Description:
                                </strong>

                                ${opportunity.description}

                            </p>


                            <a

                                class="apply-btn"

                                href="${opportunity.applicationLink}"

                                target="_blank"

                                onclick="showSuccess(this)"

                            >

                                🔗 Apply Now

                            </a>


                            <div class="success-container"></div>

                        </div>

                    `;

                }

            });


            /* No results */

            if (result === "") {

                result = `

                    <div class="no-result">

                        No opportunities available
                        in this category.

                    </div>

                `;

            }


            document.getElementById(
                "opportunityList"
            ).innerHTML = result;


        })


        .catch(error => {


            document.getElementById(
                "opportunityList"
            ).innerHTML = `

                <div class="no-result">

                    ❌ Unable to load opportunities.

                </div>

            `;


            console.error(error);

        });

}



/* =================================
   CATEGORY ICON
================================= */

function getIcon(category) {


    if (category === "Hackathon") {

        return "🏆";

    }


    if (category === "Internship") {

        return "💼";

    }


    if (category === "Scholarship") {

        return "🎓";

    }


    if (category === "Workshop") {

        return "📚";

    }


    if (category === "Startup Program") {

        return "🚀";

    }


    return "🎯";

}



/* =================================
   SUCCESS MESSAGE
================================= */

function showSuccess(button) {


    setTimeout(function() {


        const card =
            button.closest(".opportunity-card");


        const message =
            card.querySelector(".success-container");


        message.innerHTML = `

            <div class="success-message">

                ✅ Yes, you have registered successfully!

            </div>

        `;


    }, 300);

}



/* =================================
   BACK TO CATEGORIES
================================= */

function backToCategories() {


    /* Hide results */

    document.getElementById(
        "resultPage"
    ).style.display = "none";


    /* Show categories */

    document.getElementById(
        "categoryPage"
    ).style.display = "block";


    /* Clear old results */

    document.getElementById(
        "opportunityList"
    ).innerHTML = "";

}

</script>


</body>
</html>
