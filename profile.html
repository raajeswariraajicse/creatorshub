<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Creator Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #e0e7ff, transparent 35%),
                radial-gradient(circle at bottom right, #ddd6fe, transparent 35%),
                #f8fafc;

            padding: 40px 20px;
        }

        .profile-wrapper {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        /* Header */

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;
            font-size: 42px;

            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.3);
        }

        .profile-header h1 {
            margin: 18px 0 8px;

            color: #1e1b4b;
            font-size: 32px;
        }

        .profile-header p {
            margin: 0;
            color: #64748b;
            font-size: 16px;
        }

        /* Main Card */

        .profile-card {
            background: rgba(255, 255, 255, 0.95);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.10);

            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .section-title {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 22px;

            color: #312e81;
            font-size: 20px;
            font-weight: bold;
        }

        .section-title span {
            font-size: 24px;
        }

        /* Form */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #dbe1ea;

            border-radius: 12px;

            background: #f8fafc;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        input:focus,
        textarea:focus {

            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Buttons */

        .button-area {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;

            flex-wrap: wrap;
        }

        .save-btn,
        .back-btn {

            border: none;

            padding: 13px 28px;

            border-radius: 12px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .save-btn {

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .save-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(79, 70, 229, 0.35);
        }

        .back-btn {

            background: #eef2ff;

            color: #4338ca;
        }

        .back-btn:hover {

            background: #e0e7ff;

            transform: translateY(-2px);
        }

        /* Message */

        #message {

            text-align: center;

            margin-top: 20px;

            font-weight: bold;

            min-height: 22px;
        }

        /* Footer */

        .profile-footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }

        /* Mobile */

        @media (max-width: 650px) {

            body {
                padding: 25px 15px;
            }

            .profile-card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .profile-header h1 {
                font-size: 27px;
            }

            .save-btn,
            .back-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>

<div class="profile-wrapper">


    <!-- Header -->

    <div class="profile-header">

        <div class="profile-icon">
            👤
        </div>

        <h1>My Profile</h1>

        <p>
            Create your identity. Showcase your skills. Grow with Creator Hub.
        </p>

    </div>


    <!-- Profile Card -->

    <div class="profile-card">


        <div class="section-title">

            <span>✨</span>

            Personal & Professional Details

        </div>


        <div class="form-grid">


            <!-- Full Name -->

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- College -->

            <div class="form-group">

                <label>College Name</label>

                <input
                    type="text"
                    id="collegeName"
                    placeholder="Enter your college name"
                >

            </div>


            <!-- Department -->

            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    id="department"
                    placeholder="Eg: Computer Science & Engineering"
                >

            </div>


            <!-- Skills -->

            <div class="form-group full">

                <label>Skills</label>

                <input
                    type="text"
                    id="skills"
                    placeholder="Eg: Java, Spring Boot, SQL, HTML, CSS"
                >

            </div>


            <!-- LinkedIn -->

            <div class="form-group">

                <label>LinkedIn Profile</label>

                <input
                    type="url"
                    id="linkedIn"
                    placeholder="https://linkedin.com/in/yourname"
                >

            </div>


            <!-- GitHub -->

            <div class="form-group">

                <label>GitHub Profile</label>

                <input
                    type="url"
                    id="github"
                    placeholder="https://github.com/yourname"
                >

            </div>


            <!-- About Me -->

            <div class="form-group full">

                <label>About Me</label>

                <textarea
                    id="aboutMe"
                    placeholder="Tell us about yourself, your interests, goals and what you create..."
                ></textarea>

            </div>


        </div>


        <!-- Buttons -->

        <div class="button-area">

            <button
                class="save-btn"
                onclick="saveProfile()">

                💾 Save Profile

            </button>


            <button
                class="back-btn"
                onclick="location.href='dashboard.html'">

                ⬅ Back to Dashboard

            </button>

        </div>


        <p id="message"></p>


    </div>


    <div class="profile-footer">

        🚀 Creator Hub • Connect • Create • Grow

    </div>


</div>


<script>

function saveProfile() {

    const profileData = {

        fullName:
            document.getElementById("fullName").value,

        email:
            document.getElementById("email").value,

        collegeName:
            document.getElementById("collegeName").value,

        department:
            document.getElementById("department").value,

        skills:
            document.getElementById("skills").value,

        linkedIn:
            document.getElementById("linkedIn").value,

        github:
            document.getElementById("github").value,

        aboutMe:
            document.getElementById("aboutMe").value
    };


    fetch("http://localhost:8081/api/profile", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(profileData)

    })


    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to save profile");

        }

        return response.json();

    })


    .then(data => {

        document.getElementById("message").innerText =
            "✅ Profile saved successfully!";

        document.getElementById("message").style.color =
            "#16a34a";

    })


    .catch(error => {

        document.getElementById("message").innerText =
            "❌ Error saving profile";

        document.getElementById("message").style.color =
            "#dc2626";

        console.error(error);

    });

}

</script>


</body>

</html>
